name: Create and publish Calypso docker image

on:
  push:
    branches: ['Develop']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # lowercase form of the repo name — ghcr rejects uppercase paths
  IMAGE_NAME: northeastern-electric-racing/calypso

jobs:
  # One job per arch on a native runner (no QEMU), each pushing an arch-suffixed
  # staging tag. The merge job stitches them into the real multi-arch tags.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux/amd64, arch: amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # restore-keys: closest-match cache on key miss
      # https://github.com/actions/cache/blob/main/caching-strategies.md#using-restore-keys-to-download-the-closest-matching-cache
      # cargo reuses unchanged compiled artifacts
      # https://doc.rust-lang.org/cargo/guide/build-cache.html
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: calypso-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: calypso-${{ matrix.arch }}-

      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y libssl-dev cmake
          cargo build --release --locked
          mkdir -p bin
          cp target/release/calypso bin/calypso
          cp target/release/simulate bin/simulate

      - uses: docker/setup-buildx-action@v4.3.0

      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No Docker layer cache (cache-from/cache-to: type=gha) — the apt layer is
      # a few seconds and COPY invalidates every run anyway. Real build time is
      # cargo, cached above.
      - uses: docker/build-push-action@v7.3.0
        with:
          context: ./
          file: ./Dockerfile.prebuilt
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}
          # https://github.com/docker/build-push-action/issues/820
          provenance: false

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same tag set as before, so downstream consumers are unaffected
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Create multi-arch manifest
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=$(echo "$META_TAGS" | sed '/^$/d; s/^/-t /' | tr '\n' ' ')
          docker buildx imagetools create $tag_args \
            "${REGISTRY}/${IMAGE_NAME}:${{ github.sha }}-amd64" \
            "${REGISTRY}/${IMAGE_NAME}:${{ github.sha }}-arm64"
