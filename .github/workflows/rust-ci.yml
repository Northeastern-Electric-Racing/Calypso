name: Rust CI

on:
   push:
      branches:
         - main
         - Develop
   pull_request:
      branches:
         - main
         - Develop

jobs:
   build:
      runs-on: ubuntu-latest

      steps:
         - name: Setup Rust
           uses: actions/checkout@v7
           with:
            submodules: recursive
         - name: Build
           run: cargo build --all --verbose
         # `--all`: the root Cargo.toml is a package as well as the workspace
         # root, so a bare `cargo test` only runs the `calypso` package's tests
         # and silently skips every workspace member's.
         - name: Test
           run: cargo test --all --verbose
         - name: Fmt
           run: cargo fmt --all --check
         - name: Clippy
           run: cargo clippy --verbose --all -- -D warnings
