[package]
name = "calypso"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
default-run = "calypso"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

[workspace]
members = ["libs/daedalus", "libs/calypso-cangen", "calypso-sim"]

[workspace.dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.45"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
regex = "1.12.3"
schemars = "1.2.1"
definition-rs = { path = "./Odyssey-Definitions/definition-rs"}
calypso-cangen = { path = "./libs/calypso-cangen" }
daedalus = { path = "./libs/daedalus" }
rumqttc = "0.25.0"
protobuf = "3.7.2"
protobuf-codegen = "3.7.2"
clap = { version = "4.5.43", features = ["derive", "env"] }
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = { version = "0.7.16", features = ["full"] }
futures-util = "0.3.31"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["ansi", "env-filter"] }
zenoh = "1.9.0"

[dependencies]
rumqttc.workspace = true
protobuf-codegen.workspace = true
protobuf.workspace = true
bitstream-io = "4.5.0"
clap.workspace = true
regex = { workspace = true }
phf = { version = "0.13.1", features = ["macros"] }
calypso-cangen.workspace = true
daedalus.workspace = true
tokio.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-util.workspace = true
can-dbc = "9.1.0"
serde_json.workspace = true
schemars.workspace = true
num_enum = "0.7.5"
zenoh.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "3.6.1", features = ["tokio"] }

definition-rs.workspace = true


[build-dependencies]
protobuf-codegen.workspace = true
calypso-cangen.workspace = true

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
