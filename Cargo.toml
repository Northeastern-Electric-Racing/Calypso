[package]
name = "calypso"
version = "0.1.0"
edition = "2024"
#rust-version = "1.85"
default-run = "calypso"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

[workspace]
members = ["libs/daedalus", "libs/calypso-cangen"]

[workspace.dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.44"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
regex = "1.12.1"
schemars = "1.2.1"

[dependencies]
rumqttc = "0.25.0"
protobuf-codegen = "3.7.2"
protobuf = "3.7.2"
bitstream-io = "4.5.0"
clap = { version = "4.5.43", features = ["derive", "env"] }
rand = "0.9.2"
regex = { workspace = true }
phf = { version = "0.13.1", features = ["macros"] }
calypso-cangen = { path = "./libs/calypso-cangen" }
daedalus = { path = "./libs/daedalus" }
tokio = { version = "1.47.1", features = ["full"] }
futures-util = "0.3.31"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["ansi", "env-filter"] }
tokio-util = { version = "0.7.16", features = ["full"] }
can-dbc = "6.0.0"
serde_json.workspace = true
schemars.workspace = true
num_enum = "0.7.5"

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "3.5.0", features = ["tokio"] }


[build-dependencies]
protobuf-codegen = "3.7.2"
calypso-cangen = { path = "./libs/calypso-cangen" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
